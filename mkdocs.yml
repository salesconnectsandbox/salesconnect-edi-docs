site_name: MPI EDI integration guide
site_description: EDI integration guide for suppliers connecting to MPI (Market Place Integrator) by salesconnect
copyright: 'MPI – Market Place Integrator &middot; Powered by <a href="https://www.salesconnect.cz/en">salesconnect.</a> &middot; &copy; 2026 salesconnect, s.r.o.'

theme:
  name: material
  language: en
  font:
    text: Barlow
    code: Roboto Mono
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - toc.integrate
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.highlight

extra:
  generator: false

extra_css:
  - assets/brand.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Getting started:
      - Overview: index.md
      - Getting connected: getting-connected.md
      - Order process: process.md
      - Identifiers and formats: identifiers.md
  - Messages:
      - ORDERS – purchase order: messages/orders.md
      - ORDRSP – order response: messages/ordrsp.md
      - ORDCHG – order cancellation: messages/ordchg.md
      - DESADV – despatch advice: messages/desadv.md
      - INVOIC – invoice and credit note: messages/invoic.md
  - Reference:
      - Code lists: code-lists.md
      - Changelog: changelog.md
