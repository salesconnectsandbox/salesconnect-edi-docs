site_name: EDI Integration Guide
site_description: EDI integration guide for suppliers of getbigger s.r.o. (SalesConnect group)
copyright: SalesConnect group – getbigger s.r.o.

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview: index.md
  - Getting connected: getting-connected.md
  - Order process: process.md
  - Identifiers and formats: identifiers.md
  - Messages:
      - ORDERS – purchase order: messages/orders.md
      - ORDRSP – order response: messages/ordrsp.md
      - ORDCHG – order cancellation: messages/ordchg.md
      - DESADV – despatch advice: messages/desadv.md
      - INVOIC – invoice and credit note: messages/invoic.md
  - Code lists: code-lists.md
  - Changelog: changelog.md
